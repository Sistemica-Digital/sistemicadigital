<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistémica Digital | Ecosistema Comercial</title>
  
  <meta property="og:title" content="Sistémica Digital | Ecosistema Comercial">
  <meta property="og:description" content="Infraestructura, campañas de alto rendimiento y automatización para negocios B2B y E-commerce.">
  <meta property="og:image" content="logo.png">
  <meta property="og:type" content="website">

  <link rel="icon" type="image/png" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0B1B3D;
      --bg-card: #15274D;
      --accent-gold: #D49B28;
      --text-white: #FFFFFF;
      --text-muted: #94A3B8;
      --border-color: #233863;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

    body {
      background-color: var(--bg-main);
      color: var(--text-white);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem 1rem;
      text-align: center;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-top: 4px solid var(--accent-gold);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .brand-logo { max-height: 70px; width: auto; margin-bottom: 1.5rem; object-fit: contain; }
    h1 { font-size: 1.7rem; font-weight: 800; margin-bottom: 0.5rem; }
    p { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 2rem; }

    .btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--accent-gold);
      color: #0B1B3D;
      text-decoration: none;
      font-weight: 800;
      padding: 1rem 1.2rem;
      border-radius: 12px;
      margin-bottom: 1rem;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(212, 155, 40, 0.2);
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-white);
      box-shadow: none;
    }

    .step-tag {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      background: rgba(11, 27, 61, 0.2);
      padding: 4px 8px;
      border-radius: 6px;
    }

    .btn-secondary .step-tag {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
    }

    .btn:hover { transform: translateY(-2px); opacity: 0.95; }
    .btn-secondary:hover { border-color: var(--accent-gold); color: var(--accent-gold); }
  </style>
</head>
<body>
  <div class="card">
    <img src="logo.png" alt="Sistémica Digital" class="brand-logo" onerror="this.style.display='none'">
    <h1>Sistémica Digital</h1>
    <p>Portal de Onboarding e Infraestructura de Captación para Clientes</p>
    
    <a href="./brief/" class="btn">
      <span>📋 Completar Brief Estratégico</span>
      <span class="step-tag">Paso 1</span>
    </a>
    <a href="./acceso/" class="btn btn-secondary">
      <span>🔒 Asignación de Activos Meta Ads</span>
      <span class="step-tag">Paso 2</span>
    </a>
    <a href="./terminos/" class="btn btn-secondary">
      <span>📜 Términos y Condiciones</span>
      <span class="step-tag">Paso 3</span>
    </a>
  </div>
</body>
</html>
